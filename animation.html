<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animation</title>
    <style>
        .box{
            width: 100px;
            height: 100px;
            background-color: rgb(170, 133, 32);
            position: relative;
            animation-name: MyAnimation;
            animation-duration: 4s;
        }
    @keyframes MyAnimation {
        0% {background-color: rgb(255, 153, 0); left: 0px;top: 0px;}
        25% {background-color: rgba(170, 106, 11, 0.993);left: 200px;top: 0px;}
        50% {background-color: rgba(168, 108, 19, 0.781);left: 200px;top: 200px;}
        75% {background-color: rgba(255, 235, 205, 0.185);left: 0px;top: 200px;}
        100% {background-color: rgba(255, 235, 205, 0);left: 0px;top: 0px;}
    }
    </style>
</head>
<body>
    <h1> CSS Animation - Thêm Animation cho WEB</h1>
    <div class="box"></div>
</body>
</html>
